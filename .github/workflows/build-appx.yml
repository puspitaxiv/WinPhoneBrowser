name: Build Browser WP (.appx)

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    name: Bangun & tanda tangan .appx (ARM)
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - name: Probe definisi target AppxPackage
        shell: pwsh
        run: |
          $files = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin" -Recurse -Include *.targets -ErrorAction SilentlyContinue
          $files += Get-ChildItem "C:\Program Files (x86)\MSBuild" -Recurse -Include *.targets -ErrorAction SilentlyContinue
          $files += Get-ChildItem "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\MSBuild" -Recurse -Include *.targets,*.props -ErrorAction SilentlyContinue
          Write-Host "TOTAL FILES: $($files.Count)"
          $hits = $files | Select-String -Pattern 'Target Name="AppxPackage"' -List | Select-Object -First 5
          foreach ($m in $hits) { Write-Host "DEF: $($m.Path)" }
          $hit2 = Get-ChildItem "C:\Program Files (x86)\Windows Kits" -Recurse -Include MakeAppx.exe,Signtool.exe -ErrorAction SilentlyContinue | Select-Object -First 8
          foreach ($e in $hit2) { Write-Host "TOOL: $($e.FullName)" }

      - name: Siapkan sertifikat signing
        shell: pwsh
        run: |
          $cert = New-SelfSignedCertificate -Subject "CN=WPMobileBrowser" `
            -CertStoreLocation Cert:\CurrentUser\My -Type Custom `
            -KeyExportPolicy Exportable -HashAlgorithm Sha256 -KeyLength 2048 `
            -NotAfter (Get-Date).AddYears(5) `
            -TextExtension @("2.5.29.37={text}1.3.6.1.5.5.7.3.3")
          $pwd = ConvertTo-SecureString -String "wpmobile" -Force -AsPlainText
          Export-PfxCertificate -Cert $cert -FilePath "src\WPMobileBrowser_TemporaryKey.pfx" -Password $pwd | Out-Null
          New-Item -ItemType Directory -Force -Path output | Out-Null
          Export-Certificate -Cert $cert -FilePath "output\WPMobileBrowser.cer" | Out-Null
          Write-Host "Thumbprint: $($cert.Thumbprint)"

      - name: Restore & build ARM .appx (sideload)
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $msbuild = & $vswhere -latest -find "MSBuild\**\Bin\MSBuild.exe" | Select-Object -First 1
          if (-not $msbuild) { throw "MSBuild tidak ditemukan di runner" }
          Write-Host "MSBuild: $msbuild"
          & $msbuild "src\WPMobileBrowser.csproj" /t:Restore /v:minimal
          if ($LASTEXITCODE -ne 0) { throw "restore gagal" }
          New-Item -ItemType Directory -Force -Path "output\appx" | Out-Null
          & $msbuild "src\WPMobileBrowser.csproj" "/t:Build;AppxPackage" `
            /p:Configuration=Release /p:Platform=ARM /p:UapAppxPackageBuildMode=SideloadOnly `
            /p:AppxBundle=Never /p:AppxSymbolPackageEnabled=false `
            /p:AppxPackageDir="$env:GITHUB_WORKSPACE\output\appx" `
            /p:PackageCertificateKeyFile=WPMobileBrowser_TemporaryKey.pfx `
            /p:PackageCertificatePassword=wpmobile `
            /v:minimal
          if ($LASTEXITCODE -ne 0) { throw "build+package gagal" }
          Write-Host "--- isi output\appx:"
          Get-ChildItem "output\appx" -Recurse -File | ForEach-Object { Write-Host "ART: $($_.FullName) ($($_.Length) B)" }
          Write-Host "--- isi bin\ARM\Release:"
          Get-ChildItem "src\bin\ARM\Release" -Recurse -Include *.appx -ErrorAction SilentlyContinue | ForEach-Object { Write-Host "BIN: $($_.FullName) ($($_.Length) B)"; Copy-Item $_.FullName "output\appx\" -Force }

      - name: Diagnostik bila gagal
        if: failure()
        shell: pwsh
        run: |
          $f = "src\obj\ARM\Release\XamlTypeInfo.g.cs"
          if (Test-Path $f) { Get-Content $f | Select-Object -First 60 | ForEach-Object { Write-Host "GCS: $_" } }
          Write-Host "--- SDK yang tersedia:"
          Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\UnionMetadata" -Directory -ErrorAction SilentlyContinue | ForEach-Object { Write-Host "UM: $($_.Name)" }

      - name: Kemas artefak
        uses: actions/upload-artifact@v4
        with:
          name: BrowserWP-appx
          path: output/
